<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18212b"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>SV Mega Store</title></head><body>
<header><b>SRI VENKATESWARA<br><small>MEGA STORE</small></b></header>
<main>
<section id="home" class="page"><h1>Dashboard</h1><div class="cards"><div>Products<b id="pc">0</b></div><div>Units<b id="uc">0</b></div><div>Stock Value<b id="sv">₹0</b></div><div>Today's Sales<b id="ts">₹0</b></div></div><div class="grid"><button onclick="go('products')">📦 Products</button><button onclick="go('in')">➕ Stock In</button><button onclick="go('sale')">🛒 New Sale</button><button onclick="go('reports')">📊 Reports</button></div><h2>⚠️ Low Stock</h2><div id="low"></div></section>
<section id="products" class="page"><h1>Products</h1><button onclick="openP()">+ Add Product</button><input id="search" placeholder="Search..." oninput="render()"><div id="list"></div></section>
<section id="in" class="page"><h1>Stock In</h1><form onsubmit="move(event,'IN')"><select id="inP" required></select><input id="inQ" type="number" min=".01" step=".01" placeholder="Quantity" required><input id="inN" placeholder="Note"><button>Add Stock</button></form></section>
<section id="sale" class="page"><h1>New Sale</h1><form onsubmit="move(event,'OUT')"><select id="outP" required></select><input id="outQ" type="number" min=".01" step=".01" placeholder="Quantity" required><input id="outN" placeholder="Customer / note"><button>Save Sale</button></form></section>
<section id="reports" class="page"><h1>Reports</h1><div id="report" class="box"></div><h2>Recent Transactions</h2><div id="tx"></div></section>
<section id="settings" class="page"><h1>Backup</h1><p>Your data is saved on this phone/browser.</p><button onclick="backup()">📤 Export Backup</button><label class="button">📥 Restore Backup<input id="restore" type="file" accept=".json" hidden></label><button class="danger" onclick="wipe()">Delete All Data</button></section>
</main><nav><button onclick="go('home')">🏠<small>Home</small></button><button onclick="go('products')">📦<small>Products</small></button><button onclick="go('in')">➕<small>Stock</small></button><button onclick="go('sale')">🛒<small>Sale</small></button><button onclick="go('reports')">📊<small>Reports</small></button></nav>
<div id="modal" class="modal"><div class="dialog"><h2>Add/Edit Product</h2><form onsubmit="saveP(event)"><input id="id" type="hidden"><input id="name" placeholder="Product name" required><input id="cat" placeholder="Category"><input id="bar" placeholder="Barcode / SKU"><input id="buy" type="number" min="0" step=".01" placeholder="Purchase price ₹" required><input id="sell" type="number" min="0" step=".01" placeholder="Selling price ₹" required><input id="stock" type="number" min="0" step=".01" placeholder="Opening stock" required><input id="min" type="number" min="0" step=".01" value="5" placeholder="Minimum stock"><button>Save</button><button type="button" class="secondary" onclick="closeP()">Cancel</button></form></div></div>
<script src="app.js"></script></body></html>
